name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Ekstrak File Zip
      run: |
        unzip KosakataApp.zip -d extracted_app

    - name: Find and Build
      run: |
        # Cari file gradlew di dalam folder hasil ekstrak
        GRADLEW_PATH=$(find ./extracted_app -name "gradlew" -type f | head -n 1)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "File gradlew tidak ditemukan! Pastikan KosakataApp.zip berisi proyek Android yang benar."
          exit 1
        fi
        
        echo "gradlew ditemukan di: $GRADLEW_PATH"
        
        # Pindah ke direktori tempat gradlew berada
        DIR_PATH=$(dirname "$GRADLEW_PATH")
        cd "$DIR_PATH"
        
        # Beri izin eksekusi dan jalankan build
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Find and Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
